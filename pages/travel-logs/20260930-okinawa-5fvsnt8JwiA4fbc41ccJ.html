/* ---- Design tokens (semantic; palette from brief) ---- */

/* ---- Base ---- */

/* ---- Day header ---- */

/* ---- Buttons ---- */
.actions{display:flex;gap:var(--space-2);margin-top:var(--space-3);flex-wrap:wrap}
.btn{min-height:var(--target);min-width:var(--target);border:2px solid var(--color-border-soft);background:var(--color-card);color:var(--color-headline);border-radius:var(--radius-md);padding:0 var(--space-3);font-size:var(--text-sm);font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;line-height:1.2;text-decoration:none;touch-action:manipulation;user-select:none;-webkit-tap-highlight-color:transparent;transition:background-color var(--dur-base) var(--ease-out),border-color var(--dur-base) var(--ease-out),color var(--dur-base) var(--ease-out),box-shadow var(--dur-fast) var(--ease-out)}

.btn.primary:active{background:var(--color-button-active);border-color:var(--color-button-active);box-shadow:none}

.ibtn{min-width:var(--target);min-height:var(--target);border:2px solid var(--color-tertiary);color:var(--color-tertiary);background:var(--tint-tertiary);border-radius:var(--radius-md);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 var(--space-3);font-size:var(--text-sm);font-weight:700;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background-color var(--dur-base) var(--ease-out),color var(--dur-base) var(--ease-out),box-shadow var(--dur-fast)}

.item.t-transport .btn{background:var(--color-background)}

.more h4:first-child{margin-top:0}
.more p{margin:0 0 var(--space-2);max-width:70ch;color:var(--color-headline)}
.menu{display:flex;flex-wrap:wrap;gap:var(--space-2);margin-top:var(--space-1)}
.menu span{background:var(--tint-tertiary);color:var(--color-headline);border-radius:var(--radius-sm);padding:6px 10px;font-size:var(--text-sm);font-weight:500;display:inline-flex;align-items:center;gap:4px;line-height:1.3}

.tt tr.hl td{font-weight:700;color:var(--color-headline);background:var(--tint-highlight)}
.tt tr.hl td:first-child::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--color-highlight);margin-right:6px;vertical-align:1px}
.ttwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.fact{display:grid;grid-template-columns:auto 1fr;gap:2px var(--space-3);font-size:var(--text-sm)}

.sheet-bg{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;z-index:var(--z-sheet);opacity:0;visibility:hidden;transition:opacity var(--dur-base) var(--ease-out),visibility 0s linear var(--dur-base)}
.sheet-bg.open{opacity:1;visibility:visible;transition:opacity var(--dur-base) var(--ease-out)}

.sheet-bg.open .sheet{transform:translateY(0)}

/* ---- Toast ---- */
.toast{position:fixed;left:50%;bottom:calc(var(--space-6) + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--color-headline);color:#f8f5f2;padding:var(--space-3) var(--space-4);border-radius:var(--radius-md);font-size:var(--text-sm);z-index:var(--z-toast);opacity:0;visibility:hidden;transition:opacity var(--dur-base) var(--ease-out),transform var(--dur-base) var(--ease-out),visibility 0s linear var(--dur-base);display:flex;gap:var(--space-2);align-items:center;max-width:calc(100% - 32px)}

  { t:"13:30", type:"spot", title:"參觀 OIST 校園", trans:"到 15:00", intro:"沿中央走廊看實驗室外觀與展示，再到海景露台。15:00 從校門下坡約 700 m、10 分到海邊。" },
  { t:"15:10", type:"spot", title:"谷茶前の浜の碑", trans:"下坡 700 m、10 分", brief:"24 小時免費 · 4.1／58 · 按鈕會播「谷茶前節」",
    intro:"黑色石碑旁有按鈕，按下去播放以這片海為名的琉球民謠「谷茶前節（たんちゃめーぶし）」：描寫谷茶漁村的男人划船出海捕鰹魚、女人挑著魚簍到村裡販售的歡快情景，是沖繩雜踊（庶民舞）最常演出的曲目。看過沖繩傳統歌舞的人一聽就認得。也是看夕陽、撿貝殼的好地方。",

  { t:"16:00", type:"stay", title:"回飯店 check-in（房型 B）、沖澡換衣", trans:"步行 800 m、10 分", intro:"已過 15:00 排隊尖峰。16:50 順路看谷茶の丘（谷茶之丘）站旁的展望台（飯店出來 200 m）。" },
  { t:"17:10", type:"transport", title:"請櫃檯叫計程車 → 琉球の牛（琉球之牛） 恩納別館", trans:"車程約 5 分 · 約 ¥1,000–1,500 · 現金",
    intro:"麗山到別館約 2.2 km。這時段公車（谷茶の丘（谷茶之丘） → ムーンビーチ前（月亮海灘前站））有 80 分鐘班距空窗，誤點 15 分鐘就觸發「不得入場＋¥20,000 取消費」，計程車這筆帳很好算。恩納村沒有路邊攔車習慣，一定要請櫃檯代叫。",
    notes:["至少提前 15 分鐘叫車。","不想花錢就走路：2.2 km、約 30 分，沿 58 號線平路——但今天已浮潛加逛校園，自行斟酌。"] },
  { t:"17:30", type:"food", title:"晚餐：琉球の牛（琉球之牛） 恩納別館（已訂 2 名）", trans:"恩納村前兼久 101-1 · 16:30–23:00 · +81 98-923-1196", brief:"4.9／6,013 · 沖繩人氣和牛燒肉",
    intro:"沖繩最有名的和牛燒肉店之一，以嚴選黑毛和牛與石垣牛等在地牛為主，iPad 多語點餐很簡單，座位有簾子隔開。評論常提到牛肉湯非常好，可試多種醬料，餐後附牛奶布丁。別館離「ムーンビーチ前（月亮海灘前站）」站約 100 m；本店走路 5 分。",
    menu:[{n:"和牛拼盤（各部位一次吃）",top:true},{n:"牛肉湯",top:true},{n:"厚切牛舌"},{n:"牛奶布丁（附）"}],
    notes:["遲到 15 分鐘就不能入場——實質截止 17:45。","當天取消／未到店每人 ¥10,000；前一天取消每人 ¥5,000。只接受網路取消，不接受電話。","有評論說上菜順序和速度不太一致，有時肉等很久。"],
    map:"琉球の牛 恩納別館" },
  { t:"19:30", type:"transport", title:"回飯店", trans:"計程車約 5 分，或步行 2.2 km、30 分" }

  { t:"10:15", type:"spot", title:"波上宮", trans:"步行 875 m、12 分", brief:"09:00–17:00 · 免費 · 4.4／16,263 · 琉球八社之首",
    intro:"建在波之上海灘上方的珊瑚礁斷崖上，是琉球八社中地位最高的一座，主祀熊野三神。傳說古時一位漁夫在海邊拾得會說話的靈石而建社，此後歷代琉球國王每年正月親自參拜，祈求航海平安、豐漁與五穀豐收——對以海洋貿易立國的琉球王國，這裡是「國家的守護神社」。二戰中全毀，1953 年起陸續重建；現在的朱紅本殿與沖繩式紅瓦是 1993 年完成的。旁邊的波之上海灘是那霸市區唯一的海灘。",
    notes:["御守、御朱印只收現金，備約 ¥2,000。","規模不大，30 分鐘足夠；御守可能要排隊。","海灘旁就是高架橋，看不到開闊海景，順路看一眼即可。","10/5 晨跑會經過的沖宮也是琉球八社，兩座分兩天走完剛好成一組。"],
    map:"波上宮" },
  { t:"10:50", type:"transport", title:"計程車 波上宮 → 漁師食堂", trans:"約 2.7 km、8 分、¥1,000–1,200 · 現金",

    notes:["備案公車：縣廳北口 → 安謝，23／24／27／120／143 等班次密集（120 11:05、143 11:12、27 11:19、23 11:27）。","不要走 101 番：前一班是早上 7 點。"] },
  { t:"11:00", type:"food", title:"午餐：漁師食堂 魚大統領（港町）", trans:"泊漁港旁 · 10:00 開門", brief:"4.3／1,065 · 餐券機、現金",

  { t:"14:25", type:"spot", title:"沖繩縣立博物館・美術館", trans:"步行 570 m、8 分（一路往南）· 2 小時 20 分", brief:"4.3／5,484 · 週五開到 20:00 · 週一休館",
    intro:"2007 年開館，外觀灰白的石灰岩城牆造型是向琉球「御城（グスク）」致敬。常設展從琉球王國的成立、與明清的朝貢貿易、1609 年薩摩入侵、1879 年琉球處分被併入日本、沖繩戰的慘烈、戰後 27 年美軍統治到 1972 年回歸，把沖繩「和日本一般城市很不一樣」的歷史講得很清楚，幾乎所有說明都有英文。美術館以沖繩與亞洲當代作品為主，兩館分開售票，可買聯票。",
    notes:["進場先把購物袋寄投幣式寄物櫃（通常 ¥100 可退；文件未查證，現場確認，沒有就用 Main Place 的）。","多個展廳禁止拍照。","從おもろまち（歌町）站過來會經過 T-Galleria 免稅與 San-A。"],
    map:"沖縄県立博物館・美術館" },
  { t:"16:50", type:"shop", title:"Murasaki Sports（那霸 Main Place 2F）", trans:"步行 230 m、3 分 · 10:00–22:00", brief:"4.2／368 · Keen、Salomon 等登山鞋款，對百岳比較對味。", map:"ムラサキスポーツ 那覇メインプレイス" },
  { t:"17:30", type:"transport", title:"單軌 おもろまち（歌町） → 旭橋", trans:"5 站、約 15 分 · 直接刷信用卡感應進站",

  { t:"17:50", type:"stay", title:"東橫INN check-in、放購物袋", intro:"放下鞋盒再走國際通去吃飯，全程不折返、不用提著逛街。" },
  { t:"18:30", type:"food", title:"晚餐：元村炸牛排 國際通本店", trans:"走國際通 1.2 km、16 分 · 11:00–22:00 · 星巴克旁", brief:"4.9／20,928 · 整趟評價最高",
    intro:"「牛かつ（炸牛排）」是東京發跡的吃法：厚切牛排裹細麵衣，只炸 60 秒，外酥內側還是粉紅半生，桌上有小烤盤可把切片自己再煎到喜歡的熟度。元村是牛かつ（炸牛排）的代表品牌，附冰茶與圍裙，白飯可免費續一次。",
    menu:[{n:"牛かつ（炸牛排）定食 130g（點最小份就好，偏油）",top:true},{n:"山葵醬油"},{n:"岩鹽"},{n:"白飯續一次免費"}],
    notes:["入口有候位表，自己寫名字和人數，不用一直站著排。有評論說 17:30 完全沒排隊。","部分分店歷史上只收現金；本店多數評論說可刷卡，進門前 Google Maps 再確認，否則多備 ¥3,000。"],
    map:"元村 牛かつ 国際通り本店" },
  { t:"19:50", type:"spot", tag:"市場", title:"第一牧志公設市場", trans:"元村步行 3 分 · 08:00–22:00", brief:"4.1／3,154 · 純逛，晚餐已吃",
    intro:"戰後黑市起家、1950 年代成為「那霸的廚房」，2023 年新館重開。一樓賣海鮮、豬肉（沖繩的豬臉、豬腳都在這）、島蔬菜，二樓食堂可代客料理（買海鮮上樓加點幾道菜當代客費）。開到 22:00，晚餐後想再回來也行。",

    intro:"戰後從一片廢墟快速復興，被稱為「奇蹟的一英里」（約 1.6 km），是那霸最熱鬧的商店街。",

  lead:"Klook 19157 一人成團、含門票。今天唯一要卡準的是 15:00 鯨鯊餵食秀：14:40 就去黑潮之海前站位。若預報天氣差，可與 10/4 對調——陸上行程下雨照跑。",
  items:[
  { t:"06:45", type:"food", title:"飯店免費早餐", trans:"東橫INN 一般 06:30–09:00", notes:["08:00 集合，07:20 前吃完。"] },

    notes:["一日遊待訂：Klook 19157「No.1 人氣北部一日遊」NT$1,219 起、4.7／1,767、一人成團立即確認。KKday 版要湊 10 人，淡季會被取消，不採用。","備選 Klook 181710（5.0／46）：有評論說司機事先幫確認餵食秀時間，一進場就能卡位。"],
    map:"リウボウ 県庁前 那覇" },
  { t:"上午", type:"spot", title:"萬座毛", trans:"停留 30 分 · 門票 ¥100（一日遊多已含）", brief:"象鼻珊瑚礁斷崖，恩納村地標",
    intro:"18 世紀琉球國王尚敬巡視至此，讚嘆這片草原「萬人也坐得下」，因而得名「萬座毛」（毛在琉球語指草原）。斷崖是隆起的珊瑚礁石灰岩，被海浪侵蝕成象鼻形狀，崖上是沖繩縣天然紀念物的石灰岩植物群落。繞一圈約 15 分，傍晚是夕陽名所，但今天是上午場，光線在海面上。",
    map:"万座毛" },
  { t:"上午", type:"spot", title:"古宇利島・古宇利大橋", trans:"停留 30 分", brief:"「戀之島」，沖繩版亞當與夏娃",
    intro:"古宇利島流傳琉球的人類起源神話：一對男女從天而降，起初赤身無憂，每天天上會掉下麵餅；後來他們開始存糧，天上就不再落餅，兩人才學會勞動與遮羞——是沖繩版的亞當與夏娃，因此被稱作「戀之島」。2005 年開通的古宇利大橋長 1,960 m，是日本最長的免費跨海橋，橋下海水透明度極高。島北側的心型石（ティーヌ浜（Tinu 海灘））因偶像廣告成名，但 30 分鐘到不了。",
    notes:["30 分鐘不要排蝦蝦飯——遊記原話「要上去買蝦蝦飯就有點太勉強了」。"],

  { t:"13:00", type:"spot", title:"沖繩美麗海水族館", trans:"約 13:00–17:00 · 08:30–18:30、最後入館 17:30", brief:"鯨鯊餵食 15:00／17:00 · 海豚秀 10:30／11:30／13:00／15:00／17:00",
    intro:"位在 1975 年沖繩國際海洋博覽會舊址的海洋博公園內，2002 年開館。主水槽「黑潮之海」容水 7,500 噸，觀景壓克力面板厚 60 cm、寬 22.5 m，開館時是世界最大，裡面同時養著多隻鯨鯊與鬼蝠魟——鯨鯊在這裡的長期飼養紀錄是全球之最。15:00 餵食秀時鯨鯊會垂直立起身體吸食，是全館最精彩的一刻。動線是從淺灘珊瑚礁一路往深海，出口外有免費的海豚劇場與海牛、海龜館。",
    facts:{"認真逛":"2–3 小時","含表演拍照":"3–4 小時"},
    notes:["先逛室內水槽，14:40 就去黑潮之海前卡位。","水槽前的「黑潮探險」（觀景平台）有時段限制，進館先看告示。","館內冷氣強，帶薄外套。"],
    map:"沖縄美ら海水族館" },
  { t:"17:30", type:"spot", title:"北谷 美國村", trans:"逛街，不在這裡吃晚餐", brief:"美式風情商圈＋海邊步道",
    intro:"北谷町在 1981 年美軍基地部分返還後填海開發的商業區，以美國西岸小鎮為藍本，色彩鮮豔的低矮建築、美式餐廳與二手古著店，周邊仍是美軍居住區，所以街上真的很多美國人。海岸邊的落日步道（サンセットビーチ（日落海灘））是看夕陽的地方，今天日落約 18:20，正好趕上。",

  { t:"19:15", type:"food", title:"晚餐：Ocean BOO! Naha（阿古豬涮涮鍋）", trans:"久米 2-11-26 幸福大樓 1F · 週六 12:00–15:00、17:00–22:00", brief:"4.4／534 · 離飯店 133 m、2 分",
    intro:"阿古豬（アグー）是沖繩原生的黑毛豚，數量一度只剩 30 頭，經復育才回到餐桌；脂肪融點低、油花細、幾乎沒有豚臭味，做成涮涮鍋最能吃出甜味。評論大推湯頭與高麗菜，最後加粥收尾。",

  { t:"09:25", type:"spot", title:"沖繩世界・玉泉洞", trans:"09:00 開園 · 09:00–17:30、最後入園 16:00", brief:"門票 ¥2,000（KKday 156531 約 NT$370，掃 QR 換票免排隊）· 當日可重複入園",
    intro:"玉泉洞是約 30 萬年形成的石灰岩鐘乳洞，全長 5 km、公開 890 m，鐘乳石超過 100 萬根，數量與密度號稱「東洋第一」，其中「槍天井」是無數細長鐘乳石倒懸的一片天花板，「青の泉（青之泉）」則是地下水積成的藍色池。步道走完 30–40 分，慢拍約 1 小時。洞口出來的「王國村」是把沖繩各地百年古民家移築過來的聚落（多棟為國家登錄有形文化財），可看紅型、琉球玻璃、三線等工藝體驗。園區還有熱帶果園與毒蛇博物公園。",
    facts:{"超級太鼓秀":"10:30／12:30／14:30","毒蛇秀":"11:30／13:30／15:30"},
    notes:["入場一律從玉泉洞開始（單向動線），重複入場時跟工作人員說一聲比較保險。","換票後的票券收好，重複入園要出示。","園內有投幣式寄物櫃、免費 Wi-Fi、繁中手冊，但工作人員不提供外語服務。","沒有玉泉洞＋Gangala 官方套票，兩邊分開買。"],
    map:"おきなわワールド 玉泉洞" },
  { t:"10:30", type:"spot", tag:"表演", title:"超級太鼓秀（エイサー（沖繩太鼓舞））", trans:"10:30–11:00 · 王國村廣場",
    intro:"エイサー（沖繩太鼓舞）是沖繩盂蘭盆節（舊曆 7 月）迎送祖先靈魂的青年會舞，男子背大鼓邊擊邊舞、女子手舞、還有塗白臉的「京太郎」逗趣穿場。沖繩世界的版本改編成舞台秀，加入獅子舞與觀眾互動，30 分鐘節奏很快。" },
  { t:"11:30", type:"food", tag:"咖啡", title:"Cave Cafe 喝 35 咖啡", trans:"步行 5 分 · 11:30–11:50 · 只有飲料，約 ¥500", brief:"只有導覽參加者能進，而且只能在出發前喝",
    intro:"Gangala 的報到處就在一個巨大的鐘乳洞洞口下，Cave Cafe 是洞裡的咖啡座。招牌「35 コーヒー（35 咖啡）」用風化死亡的珊瑚（サンゴ，日文諧音 35）當烘焙介質，部分收益捐給珊瑚復育。",
    menu:[{n:"35 咖啡",top:true},{n:"沙翁、沖繩煎餅等零食（另售）"}],
    notes:["解散點是おきなわワールド（沖繩世界）巴士停車場，不會回到 Cave Cafe——要喝就現在。","只賣飲料，午餐要回沖繩世界園區吃。","11:50 報到截止（出發前 10 分鐘）。","園內攤位偏現金。"],
    map:"ガンガラーの谷 CAVE CAFE" },
  { t:"12:00", type:"spot", tag:"導覽", title:"Gangala 之谷 導覽（12:00 場，80 分）", trans:"解散於おきなわワールド（沖繩世界）巴士停車場", brief:"預約制 · 步道 1 km · 中文語音導覽機",
    intro:"數十萬年前鐘乳洞崩塌形成的亞熱帶山谷，只能跟導覽進入。谷內有兩個相連的洞穴聖地「イナグ洞」與「イキガ洞」（女洞、男洞），自古是祈求生育與成長的地方；一棵樹齡約 150 年的「大主ガジュマル」（榕樹之王）氣根從崖上垂落十幾公尺。最重要的是這裡正在挖掘「港川人」的痕跡——約 2 萬年前的舊石器時代人骨曾在附近出土，谷中的武芸洞出土了日本最古的埋葬人骨，考古現場就開放在導覽路線旁。導遊只講日語，有中文語音機，會發裝冰茉莉花茶的水壺（要還）和防蟲噴霧。",
    notes:["待訂：book.gangala.com（右上角切繁中），只能前一日 17:00 前訂——設 10/3 中午的提醒。電話 +81-98-948-4192（09:00–17:30）。","出發前有聯絡取消收 50%，未聯絡 100%；天候中止免費。","步道有階梯與石頭路，穿好走的鞋。"],
    map:"ガンガラーの谷" },
  { t:"13:30", type:"spot", tag:"表演", title:"毒蛇秀（ハブ博物公園（毒蛇博物公園））", trans:"出示門票重複入園 · 13:30–14:00",
    intro:"「ハブ」是沖繩特有的毒蛇波布，表演會講解它與蒙哥（マングース）的故事——20 世紀初為滅蛇引進蒙哥，結果蒙哥白天活動、波布晚上出沒，兩者根本不相遇，反而成了外來入侵物種，是生態學經典的失敗案例。" },

  { t:"17:20", type:"spot", title:"瀨長島 Umikaji Terrace", trans:"10:00–21:00 · 停留約 2 小時 · 日落約 18:20", brief:"希臘風白色階梯商場，看夕陽與飛機起降",
    intro:"瀨長島是那霸機場南側的小島，本來是海上的軍事區與廢棄地，2015 年開幕的 Umikaji Terrace 把西向斜坡蓋成一整片白牆的階梯式商場，靈感來自地中海聖托里尼；面對的是機場跑道，飛機幾乎從頭頂降落，是沖繩看夕陽和拍機的名所。島上還有龍神之湯溫泉，適合冬天。",

    intro:"奧武山公園有棒球場（沖繩職棒春訓地）、田徑場與多條步道，早晨很多在地人跑步。園內的沖宮是琉球八社之一，紅鳥居配原木色拜殿，入口有碑紀念這裡是空手道的發源地（琉球王國時代的武術「手（ティー）」在此傳承）。順路可看壺川東公園保存的「輕便鐵道」機關車——沖繩戰前有過比本土更窄軌的縣營鐵道，當地人叫「ケービン」，戰爭中全毀；公園蓋在舊鐵道遺址上，挖出的鐵軌原地保留，沒有圍欄可直接看進駕駛座。",

    intro:"回程有飛機要趕，不賭一天只有 4 班的高速 152（16:20 那班之後就是 19:15，會誤機）。21 番途中經おもろまち（歌町）駅前，塞車時可提早下車轉單軌。",
    tbl:{head:["ライカム（Rycom） 出發","抵旭橋","抵機場","距起飛"],rows:[["15:00","15:55–16:29","16:35–17:09","4h31–5h05"],["15:30 ←採用","16:25–16:59","17:05–17:39","4h01–4h35"],["16:00","16:55–17:29","17:35–18:09","3h31–4h05"],["16:30 ←底線","17:25–17:59","18:05–18:39","3h01–3h35"]],hl:1},
    notes:["別搭 111／113／123／127——停「高速山里」要走 15 分。","官方發車時刻表是圖片沒能核對，出發前用 バスなび沖縄（busnavi-okinawa.com，繁中）查一次。","最後保險：第一交通 0120-37-9439，到機場約 40 分。"],
    map:"イオンモール沖縄ライカム バス停" },
  { t:"17:00", type:"transport", title:"旭橋 → 東橫INN 取行李 → 單軌 → 那霸機場", trans:"步行 5 分＋取行李 10 分＋步行 5 分＋單軌 13 分＋走到櫃檯 5 分 ≈ 40 分",
    notes:["最晚 18:40 到機場（起飛前 3 小時）。"] },
  { t:"17:30", type:"food", title:"機場晚餐：ポーたま（豬肉蛋飯糰） 機場店", trans:"開到 21:00 · 17:05–17:39 抵達報到", menu:[{n:"3 號 炸蝦"},{n:"國際線店限定 滷肉飯口味"}], notes:["回程行李各 20 kg（tigersmart 已含）。"], map:"ポーたま 那覇空港国際線店" },
  { t:"21:40", type:"transport", title:"IT233 起飛 → 22:10 桃園", trans:"1819 機場發車末班 23:30、下一班 00:20",
    notes:["回到台北轉運站時北捷可能已收班，最後一段回永和叫車。"] }
]}
];

const CHECKLIST = [
 { g:"證件・票券・錢", why:"出發前一晚攤在桌上核對一次", items:[
   ["護照（效期 6 個月以上）"],["虎航訂位＋行李加購／選位完成","前一晚睡前在官網弄好"],["麗山確認信 ×2（兩晚不同房型）"],["東橫INN 確認信","核對 check-in 16:00／早餐時段"],["リゾートライナー（Resort Liner 機場接駁巴士） 9/30 確認信","看乘車地點是國內線或國際線航廈"],["リゾートライナー（Resort Liner 機場接駁巴士） 10/2 08:26 訂位"],["琉球の牛（琉球之牛）訂位確認（10/1 17:30）"],["Klook 一日遊憑證（10/3）"],["KKday 青洞憑證（10/1 09:30）"],["Gangala 12:00 場預約","只能 10/3 17:00 前訂，設提醒"],["沖繩世界門票 QR（KKday 156531）"],["旅平＋不便險保單"],["日幣現金 ¥50,000","要 ¥1,000 鈔至少 20 張，公車找零不收大鈔"],["零錢包","車資 ¥250、¥670 很吃硬幣"],["感應式信用卡（開海外）","公車、東京巴士、單軌都靠它"],["金融卡開跨國提款","缺現金到 FamilyMart 7-Bank ATM 領"],["悠遊卡（1819 用）"]
 ]},
 { g:"浮潛（10/1）", why:"店家直接載去 OIST，不回飯店", items:[
   ["泳衣（出門先穿在裡面）"],["快乾毛巾"],["一套換洗衣物＋內衣"],["防水袋／夾鏈袋裝濕衣"],["海洋友善防曬"],["拖鞋或水陸鞋"],["手機防水袋"],["暈船藥（怕暈就先吃）"]
 ]},
 { g:"衣物與鞋", why:"10 月初 27–30°C，白天曬、館內冷氣強", items:[
   ["短袖 ×6"],["薄長袖或防曬外套","水族館、博物館冷氣＋防曬"],["長褲 ×1（Gangala 防蚊）"],["好走的鞋","仲泊遺跡石疊、OIST 階梯、Gangala 1 km 步道"],["跑鞋＋跑衣（10/5 晨跑）"],["帽子＋太陽眼鏡","瀨長島、萬座毛完全沒遮蔽"],["折傘／輕便雨衣","颱風季尾"],["內衣襪子 ×6"]
 ]},
 { g:"電子與日用", items:[
   ["手機＋行動電源","一天靠 Google Maps／NAVITIME 查車"],["充電線（日本插座與台灣同款，不用轉接頭）"],["eSIM／SIM 卡"],["耳塞","東橫INN 隔音差、有機車聲"],["個人常備藥"],["防蚊液（Gangala 有提供，其他地方自備）"],["濕紙巾"],["折疊購物袋","免稅購物、博物館寄物"],["行李秤","去程 15 kg、回程各 20 kg"],["回程行李留空間給運動用品與伴手禮"]
 ]},
 { g:"出發前一週要做", items:[
   ["核對 9/30 谷茶の丘（谷茶之丘） 12:54 南下、19:35 北上（NAVITIME）"],["核對 10/4 54／83 番日祝班表與 83 番 15:50 末班"],["查ライカム（Rycom）回程 21／92 發車時刻（バスなび沖縄（沖繩巴士導航網））"],["追日本氣象廳颱風動態","三層退款機制：店家取消→Klook 未體驗退款→班機取消證明寄客服"],["把想買的運動用品型號＋台灣價格記在手機"],["換匯：台銀牌告，指定 ¥1,000 鈔"],["浜の家（濱之家） 9/30 晚餐訂位（可選）"],["確認元村本店現在可否刷卡（Google Maps 最新評論）"]
 ]}
];
</script>
<script>
(function(){
  const TYPE = {
    transport:{label:"交通",c:"var(--color-stroke)",l:"var(--tint-secondary)",icon:"i-bus"},
    spot:{label:"景點",c:"var(--color-highlight)",l:"var(--tint-highlight)",icon:"i-pin"},
    food:{label:"餐廳",c:"var(--food-c)",l:"var(--tint-tertiary)",icon:"i-star"},
    stay:{label:"住宿",c:"var(--stay-c)",l:"var(--tint-stroke)",icon:"i-bed"},
    shop:{label:"購物",c:"var(--color-highlight)",l:"var(--tint-paragraph)",icon:"i-list"}
  };
  const esc = s => String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
  const ic = (id,cls="ic") => `<svg class="${cls}" aria-hidden="true" focusable="false"><use href="#${id}"/></svg>`;
  const mapUrl = q => "https://www.google.com/maps/search/?api=1&query="+encodeURIComponent(q);
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)");

  const tabs = document.getElementById("tabs");
  const view = document.getElementById("view");
  const LIST = DAYS.length;
  let current = -1;

  /* ---------- Tabs (WAI-ARIA tabs: arrow keys, Home/End) ---------- */
  DAYS.forEach((d,i)=>{
    const b=document.createElement("button");
    b.className="tab"; b.setAttribute("role","tab"); b.id="tab-"+i; b.setAttribute("aria-controls","view"); b.dataset.i=i;
    b.innerHTML=`<span class="d">${esc(d.date)}<small>${esc(d.dow)}</small></span><span class="w">${esc(d.short)}</span>`;
    b.addEventListener("click",()=>go(i,true));
    tabs.appendChild(b);
  });
  const lt=document.createElement("button");
  lt.className="tab list"; lt.setAttribute("role","tab"); lt.id="tab-"+LIST; lt.setAttribute("aria-controls","view"); lt.dataset.i=LIST;
  lt.innerHTML=`<span class="d">清單</span><span class="w">旅行＋待辦</span>`;
  lt.addEventListener("click",()=>go(LIST,true));
  tabs.appendChild(lt);

  tabs.addEventListener("keydown",e=>{
    const n=tabs.children.length; let i=current;
    if(e.key==="ArrowRight") i=(current+1)%n;
    else if(e.key==="ArrowLeft") i=(current-1+n)%n;
    else if(e.key==="Home") i=0;
    else if(e.key==="End") i=n-1;
    else return;
    e.preventDefault(); go(i,true); tabs.children[i].focus();
  });

  function slug(i){ return i===LIST ? "list" : "day"+(i+1); }
  function fromHash(){
    const h=location.hash.replace("#","");
    if(h==="list") return LIST;
    const m=/^day(\d)$/.exec(h); if(m){ const k=+m[1]-1; if(k>=0&&k<LIST) return k; }
    return null;
  }

  function go(i,push){
    if(i===current) return;
    current=i;
    [...tabs.children].forEach((b,j)=>{ const sel=j===i; b.setAttribute("aria-selected",sel?"true":"false"); b.tabIndex=sel?0:-1; });
    tabs.children[i].scrollIntoView({block:"nearest",inline:"center",behavior:reduced.matches?"auto":"smooth"});
    view.setAttribute("aria-labelledby","tab-"+i);
    view.innerHTML = i<LIST ? renderDay(DAYS[i]) : renderChecklist();
    if(i===LIST) bindChecklist();
    if(push){ history.pushState(null,"","#"+slug(i)); window.scrollTo({top:0,behavior:reduced.matches?"auto":"smooth"}); }
    try{ localStorage.setItem("oki-tab", String(i)); }catch(e){}
  }
  window.addEventListener("popstate",()=>{ const i=fromHash(); if(i!==null) go(i,false); });

  /* ---------- Day rendering ---------- */
  function renderDay(d){
    const items = d.items.map((it,idx)=>{
      const ty=TYPE[it.type]||TYPE.spot;
      const hasMore = it.intro||it.menu||it.tbl||it.facts;
      const moreId=`more-${idx}`;
      const more = hasMore ? `<div class="more" id="${moreId}" role="region" aria-labelledby="t-${idx}" hidden><div><div class="inner">
          ${it.intro?`<h4>${it.type==="food"?"關於這家店":it.type==="transport"?"說明":it.type==="stay"?"關於住宿":"事前了解"}</h4><p>${esc(it.intro)}</p>`:""}
          ${it.facts?`<h4>基本資訊</h4><dl class="fact">${Object.entries(it.facts).map(([k,v])=>`<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("")}</dl>`:""}
          ${it.menu?`<h4>${it.type==="food"?"推薦品項":"必看／必買"}</h4><div class="menu" role="list">${it.menu.map(m=>`<span role="listitem">${m.top?ic("i-star","ic sm")+`<span class="sr" hidden>推薦</span>`:""}${esc(m.n)}</span>`).join("")}</div>`:""}
          ${it.tbl?`<h4>班次表</h4><div class="ttwrap"><table class="tt"><thead><tr>${it.tbl.head.map(h=>`<th scope="col">${esc(h)}</th>`).join("")}</tr></thead><tbody>${it.tbl.rows.map((r,ri)=>`<tr class="${ri===it.tbl.hl?"hl":""}" ${ri===it.tbl.hl?'aria-label="行程採用的班次"':''}>${r.map(c=>`<td>${esc(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`:""}
        </div></div></div>`:"";
      const actions = `<div class="actions">
          ${hasMore?`<button type="button" class="btn detail" aria-expanded="false" aria-controls="${moreId}" data-more="${idx}"><span class="lbl">詳細介紹</span>${ic("i-chev","ic sm chev")}</button>`:""}
          ${it.notes&&it.notes.length?`<button type="button" class="ibtn" aria-haspopup="dialog" aria-label="${esc(it.title)} 的注意事項（${it.notes.length} 項）" data-notes="${idx}">${ic("i-info","ic sm")}<span>注意 ${it.notes.length}</span></button>`:""}
          ${it.map?`<a class="btn map" href="${mapUrl(it.map)}" target="_blank" rel="noopener" aria-label="在 Google 地圖開啟 ${esc(it.map)}（新視窗）">${ic("i-pin","ic sm")}地圖${ic("i-ext","ic sm")}</a>`:""}
        </div>`;
      return `<article class="item t-${it.type}" style="--type:${ty.c};--type-light:${ty.l}">
        <div class="time" aria-label="時間 ${esc(it.t)}">${esc(it.t)}</div><div class="dot" aria-hidden="true"></div>
        <div class="card">
          <div class="top"><h3 class="title" id="t-${idx}" style="margin:0">${esc(it.title)}</h3>${it.type!=="transport"?`<span class="tag">${ic(ty.icon,"ic sm")}${esc(it.tag||ty.label)}</span>`:""}</div>
          ${it.trans?`<div class="trans">${ic("i-arrow","ic sm")}<span>${esc(it.trans)}</span></div>`:""}
          ${it.brief?`<div class="brief">${esc(it.brief)}</div>`:""}
          ${(hasMore||it.notes||it.map)?actions:""}
          ${more}
        </div></article>`;
    }).join("");
    return `<div class="dayhead">
        <h2>${esc(d.date)}（${esc(d.dow)}）${esc(d.title)}</h2>
        <div class="meta"><span>${ic("i-bed","ic sm")}${esc(d.stay)}</span><span>${ic("i-bus","ic sm")}${esc(d.table)}</span></div>
        ${d.lead?`<p class="lead">${esc(d.lead)}</p>`:""}
      </div>
      <div class="legend" aria-label="圖例">${Object.values(TYPE).map(t=>`<span><i style="--c:${t.c}"></i>${t.label}</span>`).join("")}</div>
      <div class="tl">${items}</div>`;
  }

  view.addEventListener("click",e=>{
    const dBtn=e.target.closest("[data-more]");
    if(dBtn){
      const box=document.getElementById("more-"+dBtn.dataset.more);
      const open=!box.classList.contains("open");
      if(open){ box.hidden=false; requestAnimationFrame(()=>box.classList.add("open")); }
      else { box.classList.remove("open"); if(reduced.matches) box.hidden=true; else box.addEventListener("transitionend",()=>{ if(!box.classList.contains("open")) box.hidden=true; },{once:true}); }
      dBtn.setAttribute("aria-expanded",open?"true":"false");
      dBtn.querySelector(".lbl").textContent=open?"收合":"詳細介紹";
      return;
    }
    const nBtn=e.target.closest("[data-notes]");
    if(nBtn){ openSheet(DAYS[current].items[+nBtn.dataset.notes], nBtn); }
  });

  /* ---------- Bottom sheet: focus trap, Escape, return focus ---------- */
  const bg=document.getElementById("sheetbg"), closeBtn=document.getElementById("sheet-close");
  let opener=null;
  function openSheet(it,btn){
    opener=btn;
    document.getElementById("sheet-name").textContent=it.title;
    document.getElementById("sheet-list").innerHTML=it.notes.map(n=>`<li>${ic("i-alert","ic sm")}<span>${esc(n)}</span></li>`).join("");
    bg.classList.add("open"); bg.setAttribute("aria-hidden","false");
    document.body.style.overflow="hidden";
    document.getElementById("main").setAttribute("aria-hidden","true");
    closeBtn.focus();
  }
  function closeSheet(){
    if(!bg.classList.contains("open")) return;
    bg.classList.remove("open"); bg.setAttribute("aria-hidden","true");
    document.body.style.overflow="";
    document.getElementById("main").removeAttribute("aria-hidden");
    if(opener) opener.focus();
  }
  closeBtn.addEventListener("click",closeSheet);
  bg.addEventListener("click",e=>{ if(e.target===bg) closeSheet(); });
  document.addEventListener("keydown",e=>{
    if(!bg.classList.contains("open")) return;
    if(e.key==="Escape"){ closeSheet(); return; }
    if(e.key==="Tab"){ e.preventDefault(); closeBtn.focus(); } // single focusable control
  });

  /* ---------- Toast ---------- */
  const toast=document.getElementById("toast"); let tt;
  function say(msg,action){
    toast.innerHTML=ic("i-check","ic sm")+`<span>${esc(msg)}</span>`+(action?`<button type="button" class="btn ghost" style="min-height:36px;color:#3fb3b3;margin-left:4px" id="toast-act">${esc(action.label)}</button>`:"");
    toast.classList.add("show");
    if(action) document.getElementById("toast-act").addEventListener("click",()=>{ action.fn(); hideToast(); });
    clearTimeout(tt); tt=setTimeout(hideToast, action?6000:3000);
  }
  function hideToast(){ toast.classList.remove("show"); }

  /* ---------- Checklist ---------- */
  const KEY="oki-checklist-v1";
  function loadChecks(){ try{ return JSON.parse(localStorage.getItem(KEY)||"{}"); }catch(e){ return {}; } }
  function saveChecks(o){ try{ localStorage.setItem(KEY,JSON.stringify(o)); return true; }catch(e){ return false; } }
  function renderChecklist(){
    const st=loadChecks(); let total=0,done=0;
    const groups=CHECKLIST.map((g,gi)=>{
      let gd=0;
      const rows=g.items.map((it,ii)=>{
        const id=`c-${gi}-${ii}`; total++; const c=!!st[id]; if(c){done++;gd++;}
        return `<div class="check ${c?"done":""}"><input type="checkbox" id="${id}" data-id="${id}" ${c?"checked":""}><label class="lab" for="${id}">${esc(it[0])}${it[1]?`<small>${esc(it[1])}</small>`:""}</label></div>`;
      }).join("");
      return `<section class="group" aria-labelledby="g-${gi}"><h3 id="g-${gi}">${esc(g.g)}<small aria-label="完成 ${gd} 項，共 ${g.items.length} 項">${gd}／${g.items.length}</small></h3>${g.why?`<p class="why">${esc(g.why)}</p>`:""}${rows}</section>`;
    }).join("");
    return `<div class="dayhead"><h2>旅行清單</h2><div class="meta"><span>${ic("i-list","ic sm")}依這趟行程整理：浮潛不回飯店、公車只收現金、東橫INN 要耳塞</span></div></div>
      <div class="prog"><div class="row"><b>已準備 <span id="p-done">${done}</span>／${total}</b><button type="button" class="btn ghost" id="p-reset">${ic("i-reset","ic sm")}全部重設</button></div>
      <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${done}" aria-label="準備進度"><i id="p-bar" style="width:${total?done/total*100:0}%"></i></div>
      <p class="hint">勾選會存在這台裝置的瀏覽器裡，換裝置不會同步。</p></div>
      ${groups}`;
  }
  function bindChecklist(){
    const all=[...view.querySelectorAll('input[type=checkbox]')];
    const refresh=()=>{
      const d=all.filter(x=>x.checked).length;
      document.getElementById("p-done").textContent=d;
      const bar=document.getElementById("p-bar"); bar.style.width=(d/all.length*100)+"%"; bar.parentElement.setAttribute("aria-valuenow",d);
      view.querySelectorAll(".group").forEach(grp=>{ const n=grp.querySelectorAll("input:checked").length, t=grp.querySelectorAll("input").length; const s=grp.querySelector("h3 small"); s.textContent=`${n}／${t}`; s.setAttribute("aria-label",`完成 ${n} 項，共 ${t} 項`); });
      if(d===all.length) say("全部準備好了，出發！");
    };
    all.forEach(cb=>cb.addEventListener("change",()=>{
      const st=loadChecks(); if(cb.checked) st[cb.dataset.id]=1; else delete st[cb.dataset.id];
      if(!saveChecks(st)) say("這個瀏覽器無法儲存勾選，關掉頁面就會重來");
      cb.closest(".check").classList.toggle("done",cb.checked);
      refresh();
    }));
    document.getElementById("p-reset").addEventListener("click",()=>{
      const before=loadChecks(); const n=Object.keys(before).length;
      if(!n){ say("目前沒有已勾選的項目"); return; }
      if(!confirm(`清除全部 ${n} 個已勾選項目？`)) return;
      saveChecks({}); view.innerHTML=renderChecklist(); bindChecklist();
      say("已重設清單",{label:"復原",fn:()=>{ saveChecks(before); view.innerHTML=renderChecklist(); bindChecklist(); }});
    });
  }

  /* ---------- Initial route: hash > today (during trip) > saved > Day 1 ---------- */
  let start=fromHash();
  if(start===null){
    try{
      const now=new Date(); const m=now.getMonth()+1, dd=now.getDate();
      const idx=[[9,30],[10,1],[10,2],[10,3],[10,4],[10,5]].findIndex(([mm,d])=>mm===m&&d===dd);
      if(now.getFullYear()===2026&&idx>=0) start=idx;
    }catch(e){}
  }
  if(start===null) start=0;
  go(start,false);
  history.replaceState(null,"","#"+slug(start));
})();
</script>
